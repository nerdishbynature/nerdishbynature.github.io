<header class="masthead">
  <div class="wrap">
    <a class="masthead__title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Primary">
      {%- assign nav = site.data.navigation -%}
      {%- for item in nav -%}
        <a href="{{ item.url | relative_url }}"
           {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
    </nav>
  </div>
</header>
