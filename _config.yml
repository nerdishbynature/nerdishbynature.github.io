title: nerdish by nature
tagline: Small, private iOS apps by Piet Brauer-Kallenberg
description: >-
  nerdish by nature builds small, focused iOS apps that keep your data on
  your device. Home of AirportQuiz and YouUpload.
url: "https://nerdishbynature.com"
lang: en

author:
  name: Piet Brauer-Kallenberg

github_username: nerdishbynature

# Preserves the URLs the 2015 posts were published under.
permalink: /post/:year/:month/:day/:title.html

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  # Saved MakerWorld pages used as a data source; never part of the site.
  - Piet-MakerWorld
  - Piet-MakerWorld.htm
  - Piet-MakerWorld_files
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
  - .jekyll-cache
