---
layout: default
---
<article class="prose">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%-d %B %Y" }}
      </time>
    </p>
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <hr>

  <p class="post-meta">
    <a href="{{ '/blog/' | relative_url }}">&larr; All writing</a>
  </p>
</article>
